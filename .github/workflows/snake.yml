
name: Gerar animação da cobrinha

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Gerar animação da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: gabrielperina
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23A88B63&color_dots=%230D0B0D,%23301820,%235A202D,%238F2638,%23C44854

      - name: Publicar animação
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
