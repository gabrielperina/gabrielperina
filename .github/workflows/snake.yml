name: Gerar animação da cobrinha

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Evita duas publicações simultâneas na branch output.
concurrency:
  group: snake-output
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1) Gera a cobrinha com a paleta do README.
      #    color_dots = [sem contribuição, nível 1, nível 2, nível 3, nível 4]
      #    color_dot_border substitui a borda padrão do GitHub (#1b1f230a).
      - name: Gerar animação da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: gabrielperina
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23A88B63&color_dots=%230D0B0D,%23301820,%235A202D,%238F2638,%23C44854&color_dot_border=%230D0B0D

      # 2) Remove do arquivo a barra de progresso que o snk desenha sob a grade
      #    (a "linha" que aparece conforme a cobra come os quadrados).
      #    Para manter a barra, basta apagar este passo.
      - name: Remover barra de progresso da cobrinha
        run: |
          node --input-type=module - <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";

          const file = "dist/github-contribution-grid-snake-dark.svg";
          let svg = readFileSync(file, "utf8");

          // The progress bar is a set of <rect class="u ..."> drawn under the grid.
          const bars = [...svg.matchAll(/<rect class="u [^"]*"[^>]*\sy="([\d.]+)"[^>]*\/>/g)];
          if (bars.length === 0) {
            console.log("Nenhuma barra de progresso encontrada.");
            process.exit(0);
          }
          const barY = Math.min(...bars.map((m) => Number(m[1])));

          svg = svg
            .replace(/<rect class="u [^"]*"[^>]*\/>/g, "")
            .replace(/@keyframes u[0-9a-z]+\{(?:[^{}]*\{[^{}]*\})*[^{}]*\}/g, "")
            .replace(/\.u\.u[0-9a-z]+\{[^{}]*\}/g, "")
            .replace(/\.u\{[^{}]*\}/g, "");

          // Shrink the canvas so no empty band is left where the bar used to be.
          const [, vx, vy, vw] = svg.match(/viewBox="([-\d.]+) ([-\d.]+) ([\d.]+) ([\d.]+)"/);
          const h = barY - Number(vy);
          svg = svg.replace(/<svg[^>]*>/, (tag) =>
            tag.replace(/viewBox="[^"]*"/, `viewBox="${vx} ${vy} ${vw} ${h}"`).replace(/\sheight="[^"]*"/, ` height="${h}"`),
          );

          if (/class="u /.test(svg) || /\.u[{.]/.test(svg)) {
            console.error("A barra de progresso não foi removida por completo.");
            process.exit(1);
          }
          writeFileSync(file, svg);
          console.log(`Barra de progresso removida (${bars.length} blocos). Altura final: ${h}px.`);
          EOF

      # 3) Gera o gráfico de atividade (substitui o serviço externo que saiu do ar).
      - name: Gerar gráfico de atividade
        env:
          GH_USER: gabrielperina
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module - <<'EOF'
          import { mkdirSync, writeFileSync } from "node:fs";

          const user = process.env.GH_USER;
          const token = process.env.GITHUB_TOKEN;
          const out = process.env.OUT ?? "dist/github-activity-graph.svg";
          const DAYS = 31;

          async function load() {
            if (process.env.MOCK) return JSON.parse(process.env.MOCK);
            const query = `query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{weeks{contributionDays{date contributionCount}}}}}}`;
            const res = await fetch("https://api.github.com/graphql", {
              method: "POST",
              headers: { Authorization: `bearer ${token}`, "Content-Type": "application/json", "User-Agent": "readme-activity-graph" },
              body: JSON.stringify({ query, variables: { login: user } }),
            });
            if (!res.ok) throw new Error(`GitHub API ${res.status}: ${await res.text()}`);
            const json = await res.json();
            if (json.errors) throw new Error(JSON.stringify(json.errors));
            return json.data.user.contributionsCollection.contributionCalendar.weeks
              .flatMap((w) => w.contributionDays)
              .map((d) => ({ date: d.date, count: d.contributionCount }));
          }

          const days = (await load()).sort((a, b) => a.date.localeCompare(b.date)).slice(-DAYS);
          const total = days.reduce((s, d) => s + d.count, 0);
          const max = Math.max(...days.map((d) => d.count));
          const peak = days.findLastIndex((d) => d.count === max);

          // Layout
          const W = 880, H = 330;
          const L = 64, R = 40, T = 104, B = 52;
          const cw = W - L - R, ch = H - T - B;
          const top = Math.max(4, Math.ceil(max / 4) * 4);
          const x = (i) => L + (cw * i) / (days.length - 1);
          const y = (v) => T + ch - (ch * v) / top;
          const f = (n) => n.toFixed(1);

          // Smooth curve (monotone-ish Catmull-Rom)
          const pts = days.map((d, i) => [x(i), y(d.count)]);
          let line = `M${f(pts[0][0])} ${f(pts[0][1])}`;
          for (let i = 0; i < pts.length - 1; i++) {
            const p0 = pts[i - 1] ?? pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] ?? p2;
            const t = 0.18;
            const c1 = [p1[0] + (p2[0] - p0[0]) * t, Math.min(T + ch, p1[1] + (p2[1] - p0[1]) * t)];
            const c2 = [p2[0] - (p3[0] - p1[0]) * t, Math.min(T + ch, p2[1] - (p3[1] - p1[1]) * t)];
            line += `C${f(c1[0])} ${f(c1[1])} ${f(c2[0])} ${f(c2[1])} ${f(p2[0])} ${f(p2[1])}`;
          }
          const area = `${line}L${f(x(days.length - 1))} ${T + ch}L${L} ${T + ch}Z`;

          const mono = `font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"`;
          const serif = `font-family="'Cormorant Garamond',Garamond,'Times New Roman',Georgia,serif"`;
          const fmt = (iso) => { const [, m, d] = iso.split("-"); return `${d}/${m}`; };

          const grid = [0, 1, 2, 3, 4].map((k) => {
            const v = (top / 4) * k, yy = f(y(v));
            return `<path d="M${L} ${yy}H${W - R}" stroke="#301820" ${k ? 'stroke-dasharray="2 6"' : ""}/>` +
              `<text x="${L - 14}" y="${yy}" dy="4" text-anchor="end" fill="#8A7D74" font-size="13" ${mono}>${v}</text>`;
          }).join("");

          const ticks = days.map((d, i) => (i % 5 === 0 || i === days.length - 1)
            ? `<text x="${f(x(i))}" y="${H - 22}" text-anchor="middle" fill="#8A7D74" font-size="13" ${mono}>${fmt(d.date)}</text>` : "").join("");

          const dots = pts.map(([px, py], i) => i === peak && max > 0
            ? `<circle cx="${f(px)}" cy="${f(py)}" r="9" fill="#A88B63" fill-opacity=".18"/><circle cx="${f(px)}" cy="${f(py)}" r="4.5" fill="#A88B63"/>`
            : `<circle cx="${f(px)}" cy="${f(py)}" r="2.6" fill="#0D0B0D" stroke="#C44854" stroke-width="1.4"/>`).join("");

          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de atividade: ${total} contribuições nos últimos ${DAYS} dias">
          <title>Atividade no GitHub — últimos ${DAYS} dias</title>
          <style>.ln{stroke-dasharray:4000;stroke-dashoffset:4000;animation:d 2.6s cubic-bezier(.4,0,.2,1) .2s forwards}.ar,.pt{opacity:0;animation:o 1.4s ease-out 1.2s forwards}@keyframes d{to{stroke-dashoffset:0}}@keyframes o{to{opacity:1}}</style>
          <defs>
          <linearGradient id="a" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8F2638" stop-opacity=".55"/><stop offset="1" stop-color="#301820" stop-opacity="0"/></linearGradient>
          <linearGradient id="s" gradientUnits="userSpaceOnUse" x1="${L}" x2="${W - R}" y1="0" y2="0"><stop offset="0" stop-color="#5A202D"/><stop offset=".6" stop-color="#8F2638"/><stop offset="1" stop-color="#C44854"/></linearGradient>
          <radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#301820" stop-opacity=".7"/><stop offset="1" stop-color="#0D0B0D" stop-opacity="0"/></radialGradient>
          </defs>
          <rect width="${W}" height="${H}" fill="#0D0B0D"/>
          <rect width="${W}" height="${H}" fill="url(#g)"/>
          <rect x=".5" y=".5" width="${W - 1}" height="${H - 1}" fill="none" stroke="#301820"/>
          <rect x="0" y="0" width="2" height="72" fill="#C44854"/>
          <text x="${L - 24}" y="46" fill="#A88B63" font-size="13" letter-spacing="4" ${mono}>ATIVIDADE · ÚLTIMOS ${DAYS} DIAS</text>
          <text x="${L - 24}" y="76" fill="#E8E1DC" font-size="26" letter-spacing="1" ${serif}>Contribuições diárias</text>
          <text x="${W - R}" y="50" text-anchor="end" fill="#E8E1DC" font-size="30" ${serif}>${total}</text>
          <text x="${W - R}" y="72" text-anchor="end" fill="#8A7D74" font-size="13" letter-spacing="3" ${mono}>CONTRIBUIÇÕES</text>
          ${grid}${ticks}
          <path class="ar" d="${area}" fill="url(#a)"/>
          <path class="ln" d="${line}" fill="none" stroke="url(#s)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <g class="pt">${dots}</g>
          </svg>`;

          mkdirSync(out.split("/").slice(0, -1).join("/") || ".", { recursive: true });
          writeFileSync(out, svg);
          console.log(`Gráfico de atividade gerado: ${days.length} dias, ${total} contribuições, pico ${max}.`);
          EOF

      # 4) Publica os SVGs na branch output.
      - name: Publicar animação
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: atualizar animação e gráfico de atividade"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
